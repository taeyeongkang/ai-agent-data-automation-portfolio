app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: completion
  name: 회의록 정리
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.0.7@f36c3761167b3af0bfb4975b728fe3cd126342d076e1ec5359e6d4f92557d3d4
    version: null
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 10
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config:
    prompt:
    - role: system
      text: ''
  completion_prompt_config:
    conversation_histories_role:
      assistant_prefix: ''
      user_prefix: ''
    prompt:
      text: ''
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .WEBM
    allowed_file_types:
    - image
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: true
    image:
      detail: high
      enabled: true
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-4.1-mini
    provider: langgenius/openai/openai
  more_like_this:
    enabled: false
  opening_statement: null
  pre_prompt: "[역할] 당신은 회의록을 정리하는 사무 보조입니다.\n[입력] 아래는 회의 중 적은 메모입니다.\n{{notes}}\n\
    [할 일] 메모를 읽고 결정 사항, 실행 항목(담당자·기한 포함), 다음 회의 일정을 뽑아 정리합니다.\n[출력 형식] {{format}}\
    \ 형식. 제목은 \"회의 요약\"으로 시작합니다. 담당자·기한이 메모에 없으면 \"미정\"이라고 씁니다. \n[제약] 메모에 없는 내용을\
    \ 추측해 넣지 않습니다. 한국어로 씁니다. 300자 이내.\n"
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - paragraph:
      default: ''
      hide: false
      label: 회의 내용
      required: false
      variable: notes
  - select:
      default: ''
      hide: false
      label: 출력 형식
      options:
      - 개조식
      - 표
      - 문단
      required: true
      variable: format
version: 0.7.0
