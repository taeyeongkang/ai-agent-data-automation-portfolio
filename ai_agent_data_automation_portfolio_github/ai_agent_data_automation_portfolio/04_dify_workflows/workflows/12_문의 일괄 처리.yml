    - data:
        code: "import csv, io\n\ndef main(questions: list, expected: list, results:\
          \ list) -> dict:\n    # results: 반복이 모은 \"분류|상태|답변 초안\" 문자열 배열\n    buf\
          \ = io.StringIO()\n    w = csv.writer(buf)\n    w.writerow([\"번호\", \"문의\"\
          , \"분류\", \"기대 분류\", \"일치\", \"상태\", \"답변 초안\"])\n    match, judged, need,\
          \ count = 0, 0, 0, {}\n    for i, (q, e, r) in enumerate(zip(questions,\
          \ expected, results), 1):\n        cat, state, ans = (r.split(\"|\", 2)\
          \ + [\"\", \"\", \"\"])[:3]\n        ok = \"-\" if e == \"애매\" else (\"\
          ○\" if cat == e else \"×\")\n        judged += ok != \"-\"\n        match\
          \ += ok == \"○\"\n        need += state == \"확인 필요\"\n        count[cat]\
          \ = count.get(cat, 0) + 1\n        w.writerow([i, q, cat, e, ok, state,\
          \ ans.replace(\"\\n\", \" \")])\n    summary = (f\"총 {len(results)}건 · \"\
          \ + \" · \".join(f\"{k} {v}건\" for k, v in count.items())\n            \
          \   + f\" · 확인 필요 {need}건 · 기대 분류 일치 {match} / {judged}\")\n    return {\"\
          csv\": buf.getvalue(), \"summary\": summary}"
        code_language: python3
