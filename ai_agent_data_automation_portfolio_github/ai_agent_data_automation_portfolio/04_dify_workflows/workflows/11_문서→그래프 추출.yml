    - data:
        code: "import json\n\n\ndef main(arg1: str) -> dict:\n    # LLM 답에서 { 부터 }\
          \ 까지만 꺼내 JSON으로 읽는다\n    start = arg1.find(\"{\")\n    end = arg1.rfind(\"\
          }\")\n    data = json.loads(arg1[start:end + 1])\n    # 관계 이름: (출발 노드 레이블,\
          \ 도착 노드 레이블)\n    spec = {\n        \"WORKS_AT\": (\"Employee\", \"Organization\"\
          ),\n        \"MANAGES\": (\"Employee\", \"Employee\"),\n        \"PART_OF\"\
          : (\"Organization\", \"Organization\"),\n        \"PARTICIPATED_IN\": (\"\
          Employee\", \"Event\"),\n        \"ORGANIZED\": (\"Employee\", \"Event\"\
          ),\n        \"PARTNERS_WITH\": (\"Organization\", \"Organization\"),\n \
          \   }\n    lines = []\n    total = 0\n    for rel, (la, lb) in spec.items():\n\
          \        pairs = []\n        for p in data.get(rel, []):\n            if\
          \ len(p) == 2 and p[0] and p[1]:\n                a = str(p[0]).replace(\"\
          '\", \"\").strip()\n                b = str(p[1]).replace(\"'\", \"\").strip()\n\
          \                pairs.append(\"['\" + a + \"', '\" + b + \"']\")\n    \
          \    total += len(pairs)\n        lines.append(\"FOREACH (p IN [\" + \"\
          , \".join(pairs) + \"] |\")\n        lines.append(\"  MERGE (a:\" + la +\
          \ \":__Entity__ {name: p[0]})\")\n        lines.append(\"  MERGE (b:\" +\
          \ lb + \":__Entity__ {name: p[1]})\")\n        lines.append(\"  MERGE (a)-[:\"\
          \ + rel + \"]->(b))\")\n    lines.insert(0, \"// 관계 \" + str(total) + \"\
          개 - 이 글 전체를 Aura 콘솔에 붙여 넣고 Run\")\n    return {\"result\": \"\\n\".join(lines)}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 코드
