        prompt_template:
        - id: 88ddf2ef-400e-4b05-a045-9925e7809bbe
          role: system
          text: '너는 회사 문서에서 사람 · 조직 · 행사와 그 관계를 뽑아 JSON으로만 답한다.


            [뽑을 것]

            - 사람: 이름만 쓴다. 직책 · 호칭(대표이사, 본부장, 실장, 팀장, 파트장, 책임, 선임, 매니저, PM, 대리 등)은
            빼고 「박지호」처럼 성과 이름 전체로 쓴다. 「박 선임」「김 팀장」처럼 성만 나오면 같은 문서에서 그 사람의 성명을 찾아 쓰고,
            찾을 수 없으면 뽑지 않는다.

            - 조직: 회사 · 본부 · 실 · 팀 · 파트. 「주식회사 나래소프트」는 「나래소프트」로, 「(주)한결유통」은 「한결유통」으로
            쓴다.

            - 행사: 날짜가 있는 회의 · 행사.


            [관계 - 이 여섯 가지만 쓴다. 방향을 지킨다]

            - WORKS_AT: [사람, 조직] - 그 사람이 소속된 가장 작은 조직 하나

            - MANAGES: [상사, 부하] - 방향은 반드시 상사에서 부하로. 「A가 B에게 보고한다」는 [B, A]. 팀장과 그 팀의
            팀원은 [팀장, 팀원]. 본부장과 그 본부 아래 팀장 · 파트장은 [본부장, 팀장]

            - PART_OF: [하위 조직, 상위 조직] - 예: [개발팀, 기술본부]

            - PARTICIPATED_IN: [사람, 행사]

            - ORGANIZED: [사람, 행사] - 그 행사를 주관하거나 기획한 사람

            - PARTNERS_WITH: [조직, 조직] - 계약이나 협약을 맺은 회사끼리


            [출력 - 아래 모양의 JSON 하나만 쓴다. 설명 글이나 ``` 표시는 쓰지 않는다]

            {"WORKS_AT": [["박지호", "개발팀"]], "MANAGES": [["김민준", "박지호"]], "PART_OF":
            [["개발팀", "기술본부"]], "PARTICIPATED_IN": [], "ORGANIZED": [], "PARTNERS_WITH":
            []}

            '
        - id: dab8d1da-4a40-4b55-b559-9066e5e6bcc9
          role: user
          text: '{{#1792049880872.doc#}}'
