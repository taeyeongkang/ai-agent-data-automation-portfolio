app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: chat
  name: 규정 안내 챗봇
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.0.7@f36c3761167b3af0bfb4975b728fe3cd126342d076e1ec5359e6d4f92557d3d4
    version: null
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 10
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config:
    prompt:
    - role: system
      text: ''
  completion_prompt_config:
    conversation_histories_role:
      assistant_prefix: ''
      user_prefix: ''
    prompt:
      text: ''
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .WEBM
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-5
    provider: langgenius/openai/openai
  more_like_this:
    enabled: false
  opening_statement: 안녕하세요 인사 규정 안내 봇입니다. 연차-재택근무-경비에 대해 물어보세요.
  pre_prompt: '당신은 회사의 인사팀 안내 담당자입니다. 아래 규정만 근거로 답하고, 규정에 없는 내용은 "규정에서 확인되지 않습니다.
    인사팀(내선 1234)으로 문의해 주세요."라고 답합니다. 답은 3문장 이내로 합니다.


    [연차] 입사 1년 미만은 매월 1일씩, 1년 이상은 15일. 3년 차부터 2년마다 1일 추가, 최대 25일.

    [재택근무] 주 2일까지. 전날 17시까지 팀장 승인. 신규 입사 3개월은 불가.

    [경비] 1건 10만 원 이하는 팀장 전결, 초과는 부서장. 영수증 없는 경비는 지급 불가.


    질문자는 {{dept}} 소속 {{name}}이며 근속 {{years}}년입니다. 근속 연수를 반영해 연차 일수를 계산해 답합니다.'
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions:
  - 연차는 며칠인가요?
  suggested_questions_after_answer:
    enabled: true
    model:
      completion_params:
        echo: false
        frequency_penalty: 0
        max_tokens: 0
        presence_penalty: 0
        stop: []
        temperature: 0.7
        top_p: 0
      mode: chat
      name: gpt-5
      provider: langgenius/openai/openai
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - select:
      default: ''
      label: 부서
      options:
      - 인사
      - 총무
      - 개발
      required: true
      variable: dept
  - text-input:
      default: ''
      label: 이름
      required: true
      variable: name
  - number:
      default: ''
      label: 근속 연수
      required: true
      variable: years
version: 0.7.0
