    - data:
        code: "import re\n\ndef main(rows: list) -> dict:\n    # rows: 반복 노드가 모은 \"\
          파일,기준일,담당자,금액,상태\" 문자열 배열\n    header = \"파일,기준일,담당자,금액,상태\"\n    items\
          \ = []\n    for r in rows:\n        cols = r.strip().split(\",\")\n    \
          \    try:\n            amt = int(float(cols[3]))\n        except (IndexError,\
          \ ValueError):\n            amt = 0\n        # 규칙 검사: 담당자는 한글 이름 2~4자여야\
          \ 한다\n        if cols[-1] == \"성공\" and not re.fullmatch(r\"[가-힣]{2,4}\"\
          , cols[2]):\n            cols[-1] = \"확인 필요(담당자)\"\n        items.append((amt,\
          \ \",\".join(cols)))\n    # 금액 큰 순서로 정렬\n    items.sort(key=lambda x: x[0],\
          \ reverse=True)\n    ok = [a for a, r in items if r.endswith(\",성공\")]\n\
          \    check = sum(1 for a, r in items if \"확인 필요\" in r)\n    fail = len(items)\
          \ - len(ok) - check\n    csv = \"\\n\".join([header] + [r for a, r in items])\n\
          \    summary = f\"총 {len(items)}건 · 성공 {len(ok)}건 · 확인 필요 {check}건 · 실패\
          \ {fail}건 · 성공 건 금액 합계 {sum(ok):,}원\"\n    return {\n        \"csv\": csv,\n\
          \        \"summary\": summary,\n    }"
        code_language: python3
